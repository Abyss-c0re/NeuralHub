[project]
name = "neuralhub"
version = "0.1.0"
description = "Multi-agent coordination Hub for NeuralCore (WebSocket routing, agent registry, inter-agent messaging)"
readme = "README.md"
authors = [
    { name = "Abyss-c0re", email = "dev@abyss-core.com" }
]
requires-python = ">=3.12"
dependencies = [
    "neuralcore",
]

[tool.uv.sources]
neuralcore = { path = "../NeuralCore", editable = true }

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["../NeuralCore"]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"
