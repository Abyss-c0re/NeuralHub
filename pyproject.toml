[project]
name = "neuralhub"
version = "0.1.0"
description = "WebSocket + Local multi-agent coordination layer for NeuralCore"
readme = "README.md"
authors = [
    { name = "Abyss-c0re", email = "dev@abyss-core.com" }
]
requires-python = ">=3.12"
dependencies = [
    "neuralcore @ git+https://github.com/Abyss-c0re/NeuralCore.git",
    "websockets>=16.0",
]

[tool.uv.sources]
# When working inside the ProjectNexus monorepo, use the local sibling.
# Outside (or on CI / `uv pip install`), the git dependency above is used.
neuralcore = { path = "../NeuralCore", editable = true }

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["../NeuralCore"]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"
